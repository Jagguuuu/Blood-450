
# Blood-450 — Flutter app lives in ayh_mobile/ (monorepo)
#
# Workflows:
#   blood450-android         -> Release Android APK
#   blood450-ios-compile     -> iOS compile check without signing
#   blood450-ios              -> Signed iOS IPA (requires Apple signing)
#   blood450-ios-simulator   -> iOS Simulator app for browser preview
#
# After pushing changes:
# Codemagic -> Blood-450 -> Check for configuration files
#
# Keep Apple signing credentials configured before running blood450-ios.

workflows:
  # ---------------------------------------------------------
  # 1. ANDROID RELEASE APK
  # ---------------------------------------------------------
  blood450-android:
    name: Blood450 Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ayh_mobile

    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE_URL: "http://65.2.20.185/api/"

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/ayh_mobile/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt

  # ---------------------------------------------------------
  # 2. IOS COMPILE CHECK - NO CODE SIGNING
  # ---------------------------------------------------------
  blood450-ios-compile:
    name: Blood450 iOS Compile (no signing)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: ayh_mobile

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: "http://65.2.20.185/api/"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"

    artifacts:
      - build/ios/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------
  # 3. SIGNED IOS IPA
  # Requires Apple Developer signing configuration.
  # ---------------------------------------------------------
  blood450-ios:
    name: Blood450 iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: ayh_mobile

    integrations:
      app_store_connect: Blood450

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.ayhMobile

      vars:
        BUNDLE_ID: "com.example.ayhMobile"
        # Add your numeric App Store Connect Apple ID here
        # after creating the app in App Store Connect.
        # APP_STORE_APPLE_ID: "1234567890"
        API_BASE_URL: "http://65.2.20.185/api/"

    scripts:
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build IPA
        script: |
          set -e
          BUILD_NUMBER="${CM_BUILD_ID:-1}"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # ---------------------------------------------------------
  # 4. IOS SIMULATOR BUILD
  # No Apple signing credentials required.
  # Intended for simulator testing and App Preview eligibility.
  # ---------------------------------------------------------
  blood450-ios-simulator:
    name: Blood450 iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ayh_mobile

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: "http://65.2.20.185/api/"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS Simulator app
        script: |
          flutter build ios --simulator --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL"

    artifacts:
      - build/ios/iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
