<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password updated — Blood450</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #F8FAFC;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .card {
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 22px 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 12px 32px rgba(16, 42, 86, 0.08);
    }
    h1 { color: #059669; font-size: 1.2rem; margin: 0 0 8px; font-weight: 800; }
    p { color: #64748B; line-height: 1.4; margin: 0; font-size: 0.84rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password updated</h1>
    <p>Your password has been changed. Return to the Blood450 app and sign in with your new password.</p>
  </div>
</body>
</html>
