<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Blood donation health background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a0c"/>
      <stop offset="35%" stop-color="#4a1520"/>
      <stop offset="70%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fecaca" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fecaca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Soft decorative orbs -->
  <circle cx="240" cy="180" r="160" fill="#ffffff" opacity="0.04"/>
  <circle cx="1680" cy="220" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="1540" cy="860" r="260" fill="#450a0a" opacity="0.35"/>
  <circle cx="320" cy="900" r="200" fill="#7f1d1d" opacity="0.25"/>

  <!-- Large blood drop (left) -->
  <g transform="translate(220,280)" opacity="0.22">
    <path d="M140 40c0 0 140 150 140 260 0 110-90 200-200 200S-120 410-120 300c0-110 140-260 140-260 12-16 36-16 50 0z" fill="url(#drop)" filter="url(#soft)"/>
  </g>

  <!-- Medical cross -->
  <g transform="translate(1480,340)" opacity="0.16">
    <rect x="70" y="0" width="60" height="200" rx="18" fill="url(#cross)"/>
    <rect x="0" y="70" width="200" height="60" rx="18" fill="url(#cross)"/>
  </g>

  <!-- Heart outline -->
  <g transform="translate(1380,620)" opacity="0.12" fill="none" stroke="#fecaca" stroke-width="8">
    <path d="M120 70c0-34-26-60-60-60-22 0-41 12-52 30C-3 22-22 10-44 10c-34 0-60 26-60 60 0 66 104 126 104 126s104-60 104-126z"/>
  </g>

  <!-- Subtle grid / pulse line -->
  <path d="M80 760 C 220 760, 260 680, 360 680 S 480 840, 600 840 S 760 700, 900 700 S 1060 820, 1200 820 S 1400 640, 1560 640 S 1760 780, 1880 780"
        fill="none" stroke="#fecaca" stroke-width="3" opacity="0.18" stroke-linecap="round"/>

  <!-- Small drops pattern -->
  <g fill="#fecaca" opacity="0.12">
    <path d="M560 220c0 0 18 20 18 34a18 18 0 1 1-36 0c0-14 18-34 18-34z"/>
    <path d="M720 160c0 0 14 16 14 26a14 14 0 1 1-28 0c0-10 14-26 14-26z"/>
    <path d="M980 240c0 0 16 18 16 30a16 16 0 1 1-32 0c0-12 16-30 16-30z"/>
    <path d="M1120 180c0 0 12 14 12 22a12 12 0 1 1-24 0c0-8 12-22 12-22z"/>
  </g>

  <!-- Bottom vignette -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.15"/>
</svg>
